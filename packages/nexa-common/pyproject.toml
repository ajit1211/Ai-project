[project]
name = "nexa-common"
version = "0.1.0"
description = "Contracts shared by NEXA services: errors, logging, identifiers."
requires-python = ">=3.13,<3.14"
dependencies = [
    "pyjwt[crypto]>=2.15.1",
    "structlog>=26.1.0",
    "uuid-utils>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexa_common"]
