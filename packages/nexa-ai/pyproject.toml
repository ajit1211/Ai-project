[project]
name = "nexa-ai"
version = "0.1.0"
description = "NEXA AI Gateway: canonical types, provider adapters, routing, fallback and metering."
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=0.75.0",
    "httpx>=0.28.1",
    "jsonschema>=4.25.0",
    "nexa-common",
    "openai>=2.0.0",
    "pydantic>=2.13.0",
]

[tool.uv.sources]
nexa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexa_ai"]
