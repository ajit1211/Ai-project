[project]
name = "nexa"
version = "0.1.0"
description = "NEXA AI Intelligence & Agent Platform (workspace root)"
requires-python = ">=3.13,<3.14"
dependencies = ["nexa-ai", "nexa-common", "nexa-core", "nexa-runtime"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/nexa-common", "packages/nexa-ai", "apps/core", "apps/runtime"]

[tool.uv.sources]
nexa-ai = { workspace = true }
nexa-common = { workspace = true }
nexa-core = { workspace = true }
nexa-runtime = { workspace = true }

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "fakeredis[lua]>=2.39.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "UP", "B", "S", "SIM", "RUF", "DJ", "ASYNC", "PT", "C4", "PIE", "RET", "TID",
]
ignore = ["E501"]  # the formatter owns line length

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"**/models.py" = ["RUF012", "S105"]  # Meta options are class attributes; choices are not secrets
"**/audit/actions.py" = ["S105"]  # action names such as PASSWORD_RESET are not secrets
"**/views.py" = ["RUF012"]  # DRF configures views through class attributes
"scripts/**" = ["S101", "S105", "S310"]  # developer tooling: asserts, throwaway secrets, localhost URLs
"**/testing.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["nexa_ai", "nexa_common", "nexa_core", "nexa_runtime"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy", "mypy_django_plugin.main"]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["dj_database_url.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "nexa_core.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "nexa_core.settings"
testpaths = [
    "packages/nexa-common/tests",
    "packages/nexa-ai/tests",
    "apps/core/tests",
    "apps/runtime/tests",
]
addopts = "--import-mode=importlib --strict-markers -ra"
