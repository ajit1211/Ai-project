[project]
name = "nexa-runtime"
version = "0.1.0"
description = "NEXA Runtime: the FastAPI AI plane (gateway, chat, retrieval, agent runs)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "nexa-ai",
    "nexa-common",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv.sources]
nexa-ai = { workspace = true }
nexa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexa_runtime"]
