[project]
name = "nexa-core"
version = "0.1.0"
description = "NEXA Core: the Django control plane (identity, tenancy, configuration, admin)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django-cors-headers>=4.9.0",
    "django-stubs-ext>=6.1.2",
    "django[argon2]>=5.2,<5.3",
    "djangorestframework>=3.18.3",
    "nexa-common",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.0",
    "python-docx>=1.2",
    "redis>=8.1.0",
    "tzdata>=2026.5",
]

[tool.uv.sources]
nexa-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nexa_core"]
